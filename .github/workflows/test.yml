name: Kiểm thử giao diện
on:
  push:
  pull_request:
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --check admin/admin.js && node --check quiz/quiz.js
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/ui_test.py
